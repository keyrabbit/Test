<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Flat 14</title>
<!-- Installability. `maximum-scale=1` above is deliberate and is normally an
     accessibility mistake: pinch-zoom on a first-person game turns a look drag
     into a page zoom, and there is no text to enlarge — every readable thing in
     this game is a 3D surface you walk up to. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a191c">
<!-- iOS reads none of the manifest for the home-screen icon or for standalone
     mode, so these three are not duplicates of it. -->
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flat 14">
<meta name="mobile-web-app-capable" content="yes">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#111318;
    font-family:"Segoe UI", Inter, system-ui, -apple-system, sans-serif;color:#f2f2f0}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  #crosshair{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;
    border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1.5px rgba(0,0,0,.35);
    pointer-events:none;transition:transform .12s ease,background .12s ease}
  #crosshair.on{transform:scale(1.9);background:#f25c26}
  #label{position:fixed;left:50%;top:calc(50% + 26px);transform:translateX(-50%);
    font-size:14px;font-weight:600;letter-spacing:.02em;padding:6px 12px;border-radius:8px;
    background:rgba(16,18,22,.72);opacity:0;transition:opacity .12s ease;pointer-events:none;
    white-space:nowrap}
  #label.on{opacity:1}
  #hud{position:fixed;left:0;right:0;top:0;padding:16px 22px;display:flex;gap:16px;
    align-items:center;pointer-events:none;
    background:linear-gradient(180deg,rgba(10,12,15,.55),rgba(10,12,15,0))}
  #hud b{font-size:15px;letter-spacing:.14em;text-transform:uppercase}
  #hud span{font-size:14px;color:#cfd2d6}
  #hint{position:fixed;left:0;right:0;bottom:20px;text-align:center;font-size:13px;
    color:#b9bcc1;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;gap:18px;
    align-items:center;justify-content:center;background:rgba(12,14,18,.82);cursor:pointer;
    backdrop-filter:blur(3px)}
  #start h1{margin:0;font-size:42px;letter-spacing:.16em;font-weight:600}
  #start p{margin:0;color:#c3c6cb;font-size:15px}
  #start .k{display:inline-block;padding:3px 9px;border-radius:6px;border:1px solid #5a6068;
    margin:0 3px;font-size:13px}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#111318;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#8a9098}

  /* Touch. The layer itself must not eat pointer events — the canvas is what
     reads the stick and the look drag — so only the controls take them back. */
  #touch{position:fixed;inset:0;pointer-events:none;z-index:5;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #touch[hidden]{display:none}
  #touch .tk{position:fixed;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;
    border:2px solid rgba(255,255,255,.16);opacity:0;transition:opacity .12s}
  #touch .tk.on{opacity:1}
  #touch .tk::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;
    margin:-23px 0 0 -23px;border-radius:50%;background:rgba(242,92,38,.55);
    transform:translate(var(--nx,0),var(--ny,0))}
  #touch .tbar{position:fixed;right:14px;bottom:14px;display:flex;gap:10px}
  #touch .tslots{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:8px}
  #touch .tb,#touch .ts{pointer-events:auto;background:rgba(22,26,33,.72);color:#e9eaec;
    border:1px solid rgba(255,255,255,.18);border-radius:10px;font:inherit;font-size:14px;
    padding:11px 15px;backdrop-filter:blur(2px);touch-action:none}
  #touch .ts{width:44px;padding:11px 0;text-align:center}
  #touch .tb.hit,#touch .ts.hit{background:rgba(242,92,38,.8);border-color:#f25c26}
  /* Without this the browser claims drags for scroll and pinch-zoom, and the
     look gesture simply never arrives. */
  canvas{touch-action:none}
</style>
  
</head>
<body>
<div id="app"></div>
<div id="crosshair"></div>
<div id="label"></div>
<div id="hud"><b>Flat 14</b><span id="hudsub">The door is locked and the keypad is dead.</span></div>
<div id="hint">WASD to move · mouse to look · click to examine · <b>Esc</b> to release the cursor</div>
<div id="start"><h1>FLAT 14</h1>
  <p>You are inside. The door is locked and the keypad is dead.</p>
  <p><span class="k">W A S D</span> move <span class="k">mouse</span> look <span class="k">click</span> examine</p>
  <p style="margin-top:8px;color:#f25c26;font-weight:600">Click to begin</p></div>
<div id="loading">building the room</div>

.3],look:[2.55,1.05,-.45],claim:`Counter run: dishes, tins, the scorched socket. Density at reading distance.`},{name:`07-entrance`,pos:[-.3,1.58,.55],look:[-2.55,.55,-1.15],claim:`Entrance: shoes, mat, coat rail, skirting shadow along the left wall.`},{name:`08-pendant`,pos:[.2,1.48,1.62],look:[.2,2.35,.15],power:!0,claim:`Pendant lit, and the shade doing its job: bulb glowing inside it, ceiling above unblown and evenly toned.`},{name:`09-consumer-unit`,pos:[-1.62,1.72,1.36],look:[-1.62,1.68,-1],setup:[`cabinet`],claim:`Consumer unit open: breaker labels legible, riser hatch released.`},{name:`10-burnt-plug`,pos:[1.86,1.2,.34],look:[2.55,.98,-.55],claim:`The scorched plug. The room's loudest single clue must stay loudest.`},{name:`11-open-drawer`,pos:[-.71,1.34,-.34],look:[-.71,.72,-1.3],setup:[`drawer`],claim:`Open drawer: passport and manual readable, not lost in the new clutter.`},{name:`12-doormat`,pos:[-.9,1.5,.35],look:[-1.95,.35,.45],setup:[`mat`],claim:`Lifted doormat and the flyer beneath it.`},{name:`13-receipt`,pos:[-.62,1.3,-.95],look:[-.62,.72,-1.45],setup:[`receipt`],claim:`Receipt flattened on the desk: the April date has to survive the jitter pass.`},{name:`14-fridge`,pos:[1.72,1.56,-.52],look:[2.55,1.28,-1.05],claim:`Fridge door: magnets and calendar, the second half of the date clue.`},{name:`15-carry-torch`,pos:[-1.42,1.52,-.3],look:[-2.45,.95,-1.15],setup:[`cabinet`,`torchlit`],claim:`The verb: a lit torch held in hand, its beam on the riser, inventory bar below.`},{name:`16-hall-wide`,pos:[-3.15,1.66,.15],look:[-8.4,1.3,0],hall:!0,claim:`The hall from the flat door: marble, dado, 3.4 m ceiling, and the one shaft of daylight through the fanlight over the portone.`},{name:`17-portone`,pos:[-6.3,1.55,.1],look:[-8.55,1.35,-.05],hall:!0,claim:`The way out. Two leaves, the lock plate at face height, the fanlight above — the frame that has to make the door read as the goal.`},{name:`18-keyway`,pos:[-7.55,1.22,-.28],look:[-8.56,1.16,-.3],hall:!0,claim:
