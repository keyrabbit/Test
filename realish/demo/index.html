<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/Test/realish/demo/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Seven items a day. Some were made by a person. Some were generated. Decide which is which.">
  <meta name="theme-color" content="#0E0E11">
  <meta name="color-scheme" content="dark">

  <!-- iPhone standalone / Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="REALISH">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>REALISH - Human or AI?</title>

  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0E0E11; color: #F2F2F4;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Splash shown until the Flutter engine paints, so a cold Home Screen
       launch never flashes white on iOS. */
    #boot {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: #0E0E11; z-index: 9999;
      transition: opacity .3s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: .35em; font-weight: 700; font-size: 15px; color: #63636E;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot">REALISH</div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var b = document.getElementById("boot");
      if (b) { b.classList.add("hide"); setTimeout(function () { b.remove(); }, 320); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
