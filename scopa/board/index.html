<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scopa — Gauntlet Loop</title>
<style>
  :root{
    --bg:#0a1410; --panel:#0f1d17; --panel2:#13251d; --line:#20382c;
    --ink:#e8efe9; --muted:#8fa79a; --gold:#d8b45a; --green:#3fae74;
    --amber:#e0a94a; --red:#d16a6a; --blue:#5a9bd8;
    --radius:14px; --shadow:0 10px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#12281e,#08110d 60%);
    color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;padding:32px 20px 80px}
  .wrap{max-width:1100px;margin:0 auto}
  header{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
  h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.2px}
  h1 .accent{color:var(--gold)}
  .sub{color:var(--muted);max-width:820px}
  .bar{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 18px;margin:14px 0;box-shadow:var(--shadow)}
  .bar h3{margin:0 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .meta{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 6px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
  .chip b{color:var(--green)}
  .chip.updated{color:var(--muted)}
  section{margin-top:26px}
  section h2{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .pieces{display:grid;gap:12px}
  .piece{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:start}
  .piece .title{font-weight:600}
  .piece .gap{grid-column:1/2;color:var(--muted);font-size:13.5px}
  .piece .gap b{color:var(--amber);font-weight:600}
  .piece .verdict{grid-column:1/2;font-size:13.5px;color:var(--green)}
  .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;white-space:nowrap}
  .status{font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
  .s-pending{color:var(--muted)}
  .s-building{color:var(--amber);border-color:#5a4a22;background:#241d0e}
  .s-judging{color:var(--blue);border-color:#264056;background:#0e1c28}
  .s-won{color:#0c1a12;background:var(--green);border-color:var(--green);font-weight:700}
  .s-looping{color:var(--red);border-color:#5a2626;background:#241010}
  .round{font-size:12px;color:var(--muted)}
  .round b{color:var(--ink)}
  .shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  figure img{width:100%;display:block;background:#000}
  figcaption{padding:9px 12px;font-size:13px;color:var(--muted)}
  .log{border-left:2px solid var(--line);padding-left:16px;display:flex;flex-direction:column;gap:10px}
  .log .row{display:grid;grid-template-columns:52px 1fr;gap:12px;font-size:13.5px}
  .log time{color:var(--gold);font-variant-numeric:tabular-nums}
  .log .ev{color:var(--ink)}
  footer{margin-top:40px;color:var(--muted);font-size:12px;text-align:center}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:7px;
    box-shadow:0 0 0 0 rgba(63,174,116,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,174,116,.5)}70%{box-shadow:0 0 0 8px rgba(63,174,116,0)}100%{box-shadow:0 0 0 0 rgba(63,174,116,0)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="accent">Scopa</span> — Gauntlet Loop</h1>
    <div class="sub" id="goal"></div>
  </header>

  <div class="bar">
    <h3>The Bar</h3>
    <div id="bar"></div>
  </div>

  <div class="meta" id="meta"></div>

  <section>
    <h2>Pieces &amp; Rounds</h2>
    <div class="pieces" id="pieces"></div>
  </section>

  <section>
    <h2>Baseline — the &ldquo;before&rdquo;</h2>
    <div class="shots" id="baseline"></div>
  </section>

  <section id="afters-sec">
    <h2>Latest round — the &ldquo;after&rdquo; (GPU render layer)</h2>
    <div class="shots" id="afters"></div>
  </section>

  <section>
    <h2>Live Log</h2>
    <div class="log" id="log"></div>
  </section>

  <footer>
    <span class="dot"></span><span id="foot"></span> · auto-refreshes every 5s
  </footer>
</div>

<script>
const STATUS_CLASS = { pending:'s-pending', building:'s-building', judging:'s-judging', won:'s-won', looping:'s-looping' };
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function load(){
  let d;
  try { d = await (await fetch('status.json?_='+Date.now())).json(); }
  catch(e){ document.getElementById('foot').textContent = 'status.json not reachable'; return; }

  document.getElementById('goal').textContent = d.goal || '';
  document.getElementById('bar').textContent = d.bar || '';

  const meta = [];
  if (d.stack) meta.push(`<span class="chip">${esc(d.stack)}</span>`);
  if (d.foundation){
    meta.push(`<span class="chip">tests <b>${esc(d.foundation.tests)}</b></span>`);
    meta.push(`<span class="chip">typecheck <b>${esc(d.foundation.typecheck)}</b></span>`);
    meta.push(`<span class="chip">build <b>${esc(d.foundation.build)}</b></span>`);
  }
  if (d.updated) meta.push(`<span class="chip updated">updated ${esc(d.updated)}</span>`);
  document.getElementById('meta').innerHTML = meta.join('');

  document.getElementById('pieces').innerHTML = (d.pieces||[]).map(p=>{
    const cls = STATUS_CLASS[p.status] || 's-pending';
    const gap = p.gap!==undefined?p.gap:p.biggest_gap;
    return `<div class="piece">
      <div class="title">${esc(p.title)}</div>
      <div class="side">
        <span class="status ${cls}">${esc(p.status)}</span>
        <span class="round">round <b>${esc(p.round||0)}</b></span>
      </div>
      ${gap?`<div class="gap"><b>Biggest gap:</b> ${esc(gap)}</div>`:''}
      ${p.verdict?`<div class="verdict">✓ ${esc(p.verdict)}</div>`:''}
    </div>`;
  }).join('');

  document.getElementById('baseline').innerHTML = (d.baseline||[]).map(s=>
    `<figure><img src="${esc(s.src)}" alt="${esc(s.label)}"><figcaption>${esc(s.label)}</figcaption></figure>`
  ).join('');

  const afters = d.afters||[];
  document.getElementById('afters-sec').style.display = afters.length ? '' : 'none';
  document.getElementById('afters').innerHTML = afters.map(s=>
    `<figure><img src="${esc(s.src)}" alt="${esc(s.label)}"><figcaption>${esc(s.label)}</figcaption></figure>`
  ).join('');

  document.getElementById('log').innerHTML = (d.log||[]).slice().reverse().map(l=>
    `<div class="row"><time>${esc(l.time)}</time><div class="ev">${esc(l.event)}</div></div>`
  ).join('');

  document.getElementById('foot').textContent = `${(d.pieces||[]).length} pieces tracked`;
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
