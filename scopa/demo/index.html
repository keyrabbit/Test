<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A2B21" />
    <title>Settebello</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Reset just enough. The game is a canvas; the DOM is chrome and overlays. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #08130f;
        color: #f3ece0;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        /* Stop iOS from bouncing the whole page when a drag starts on the felt. */
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        position: fixed;
        inset: 0;
        display: block;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
        /* The canvas handles its own gestures; let it see every pointer event. */
        touch-action: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
      }
      #overlay > * {
        pointer-events: auto;
      }

      /* First paint: a calm hold while the deck rasterises, rather than a white flash. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 42% 38%, #1e5c46, #07110d 78%);
        transition: opacity 520ms ease;
        z-index: 10;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      .boot-inner {
        text-align: center;
        max-width: 22rem;
        padding: 0 1.5rem;
      }
      .boot-title {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: clamp(2.6rem, 9vw, 4.4rem);
        font-weight: 600;
        letter-spacing: 0.03em;
        margin: 0;
        background: linear-gradient(180deg, #fff3ce, #e0b45e 55%, #b8862a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .boot-sub {
        margin: 0.35rem 0 2rem;
        font-size: 0.82rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #8fae9f;
      }
      .boot-bar {
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .boot-bar > i {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: 3px;
        background: linear-gradient(90deg, #d8a94a, #f3dc96);
        transition: width 240ms ease;
      }

      @media (prefers-reduced-motion: reduce) {
        #boot,
        .boot-bar > i {
          transition: none;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DlqU2-ov.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
    </div>
    <div id="overlay"></div>

    <div id="boot">
      <div class="boot-inner">
        <h1 class="boot-title">Settebello</h1>
        <p class="boot-sub">Scopa</p>
        <div class="boot-bar"><i id="boot-bar"></i></div>
      </div>
    </div>

    <!--
      Two entry points share one page. `?hero=1` boots the GPU "hero" scene — a
      self-contained, judged-in-isolation vertical slice of the table at AAA quality —
      while every other URL boots the real game exactly as before. Split here rather
      than inside main.ts so the app's boot sequence is never touched by the flag.
    -->
  </body>
</html>
